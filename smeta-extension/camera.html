<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доступ к камере — Задачи и сметы</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, 'Segoe UI', sans-serif; background: #FCFBFF; color: #2A2140; }
  @media (prefers-color-scheme: dark) { body { background: #17121F; color: #EEE8FA; } }
  .card { max-width: 420px; padding: 28px; text-align: center; }
  .big { font-size: 56px; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { opacity: .8; }
</style>
</head>
<body>
<div class="card">
  <div class="big" id="ic">🖐</div>
  <h1 id="t">Разрешите доступ к камере</h1>
  <p id="p">Chrome спросит сверху слева — нажмите «Разрешить». Камера нужна только для жестов в панели; видео никуда не отправляется.</p>
</div>
<script src="camera.js"></script>
</body>
</html>
