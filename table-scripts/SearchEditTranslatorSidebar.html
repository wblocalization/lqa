<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include('Общее') ?>
</head>
<body class="has-foot">
  <div class="stack">
    <label class="field">Найти<input type="text" id="q" placeholder="Задача, заказчик, раздел или имя"></label>
    <div class="small muted" id="qHint">Ваши задачи:</div>
    <div class="results" id="results"></div>

    <div id="editor" class="stack" hidden>
      <div class="card"><div class="t" id="cardTitle"></div><div class="small muted" id="cardMeta"></div></div>
      <div class="field">Готовность<div class="seg" id="readySeg"></div></div>
      <label class="field">Задача<input type="text" id="f_task"></label>
      <label class="field">Ссылка на Band<input type="url" id="f_link"></label>
      <div class="field">Переводчик<div id="f_translators"></div></div>
      <div class="field">Редактор<div id="f_editors"></div></div>
      <details class="more">
        <summary>Дата, сторона, раздел, заказчик, комментарий</summary>
        <div class="stack">
          <div class="two">
            <label class="field">Дата<input type="date" id="f_date"></label>
            <label class="field">Сторона<select id="f_side"></select></label>
          </div>
          <label class="field">Раздел<select id="f_razdel"></select></label>
          <label class="field">Заказчик<input type="text" id="f_customer"></label>
          <label class="field">Комментарий<textarea id="f_comment"></textarea></label>
        </div>
      </details>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <div class="foot col" id="foot" hidden>
    <button class="btn primary full" id="saveBtn" type="button">Сохранить</button>
    <button class="link-danger" id="deleteBtn" type="button">Удалить задачу</button>
  </div>

<script>
  const READY = ['Не начато', 'В работе', 'На проверке', 'Готово'];
  const READY_COLORS = { 'Не начато': '#EFEFEF', 'В работе': '#D6E4F0', 'Готово': '#D9EAD3', 'На проверке': '#FFF2CC' };
  let CATEGORIES = {}, PEOPLE = [], current = null, readiness = '';

  Promise.all([run('getContentCategories'), run('getTranslatorNames')]).then(([cats, names]) => {
    CATEGORIES = cats; PEOPLE = names;
    fillSelect($('#f_side'), Object.keys(cats), '—');
    search('');
  }).catch(e => setMsg($('#msg'), 'Не получилось загрузить списки: ' + e.message, 'err'));

  let timer = null, seq = 0;
  $('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search($('#q').value), 350); });

  function search(q) {
    const my = ++seq;
    $('#qHint').textContent = q.trim() ? 'Найдено:' : 'Ваши задачи (или последние, если вашей почты нет в «Списках»):';
    run('searchTranslatorTasks', q).then(list => {
      if (my !== seq) return;
      $('#results').innerHTML = list.length ? list.map(r =>
        `<button type="button" data-row="${r.row}">${esc(r.title)} <span class="d">· ${esc(r.side)} · ${esc(r.date)}${r.readiness ? ' · ' + esc(r.readiness) : ''}</span></button>`
      ).join('') : '<div class="small muted" style="padding:8px 10px">Ничего не найдено</div>';
    }).catch(e => setMsg($('#msg'), 'Поиск не сработал: ' + e.message, 'err'));
  }

  $('#results').addEventListener('click', e => {
    const b = e.target.closest('button[data-row]');
    if (!b) return;
    $$('#results button').forEach(x => x.classList.toggle('on', x === b));
    run('getTranslatorTaskForEdit', Number(b.dataset.row)).then(fill).catch(err => setMsg($('#msg'), 'Не открылась: ' + err.message, 'err'));
  });

  function renderReady() {
    $('#readySeg').innerHTML = READY.map(s =>
      `<button type="button" data-s="${esc(s)}" class="${s === readiness ? 'on' : ''}" style="${s === readiness ? 'background:' + READY_COLORS[s] : ''}">${esc(s)}</button>`).join('');
  }
  $('#readySeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-s]');
    if (b) { readiness = b.dataset.s; renderReady(); }
  });

  function peopleChips(el, chosen) {
    renderChips(el, [{ items: PEOPLE }, { title: 'Другие', items: chosen.filter(n => !PEOPLE.includes(n)) }], chosen);
  }

  function updateRazdel(selected) {
    const items = CATEGORIES[$('#f_side').value] || [];
    fillSelect($('#f_razdel'), items.includes(selected) || !selected ? items : items.concat([selected]), '—', selected);
  }
  $('#f_side').addEventListener('change', () => updateRazdel(''));

  function fill(t) {
    current = t;
    readiness = t.readiness || 'Не начато';
    $('#cardTitle').textContent = t.task || '(задача не заполнена)';
    $('#cardMeta').textContent = [t.side, t.razdel, t.customer].filter(Boolean).join(' · ');
    renderReady();
    $('#f_task').value = t.task; $('#f_link').value = t.link; $('#f_date').value = t.date;
    $('#f_side').value = t.side; updateRazdel(t.razdel);
    $('#f_customer').value = t.customer; $('#f_comment').value = t.comment;
    peopleChips($('#f_translators'), t.translatorNames);
    peopleChips($('#f_editors'), t.editorNames);
    $('#editor').hidden = false; $('#foot').hidden = false;
    setMsg($('#msg'), '');
  }

  $('#saveBtn').addEventListener('click', () => {
    if (!current) return;
    const task = {
      row: current.row, origKey: current.origKey, readiness: readiness,
      task: $('#f_task').value, link: $('#f_link').value, date: $('#f_date').value, side: $('#f_side').value,
      razdel: $('#f_razdel').value, customer: $('#f_customer').value, comment: $('#f_comment').value,
      translator: chipValues($('#f_translators')).join(', '), editor: chipValues($('#f_editors')).join(', ')
    };
    const btn = $('#saveBtn');
    btn.disabled = true;
    setMsg($('#msg'), 'Сохраняю…');
    run('saveTranslatorTaskEdits', task)
      .then(r => run('getTranslatorTaskForEdit', r.row)).then(fill)
      .then(() => { setMsg($('#msg'), 'Сохранено ✓', 'ok'); search($('#q').value); })
      .catch(e => setMsg($('#msg'), 'Не сохранилось: ' + e.message, 'err'))
      .finally(() => { btn.disabled = false; });
  });

  $('#deleteBtn').addEventListener('click', () => {
    if (!current) return;
    if (!confirm('Удалить задачу «' + (current.task || '') + '»? Отменить будет нельзя.')) return;
    run('deleteTranslatorTask', current.row, current.origKey).then(() => {
      current = null;
      $('#editor').hidden = true; $('#foot').hidden = true;
      setMsg($('#msg'), 'Удалено.', 'ok');
      search($('#q').value);
    }).catch(e => setMsg($('#msg'), 'Не удалилось: ' + e.message, 'err'));
  });
</script>
</body>
</html>
