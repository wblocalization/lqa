<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include('Общее') ?>
<style>
  .filters { display: grid; grid-template-columns: 1fr 1fr 1.4fr 1.4fr; gap: 10px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .grid th { text-align: left; font-size: 11.5px; color: var(--soft); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
  .grid td { padding: 6px 8px; border-bottom: 1px solid #F0F1F3; vertical-align: top; }
  .grid td.num, .grid th.num { text-align: right; white-space: nowrap; }
  .grid tr.bad td { background: var(--warn-soft); }
  .grid tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: none; }
  .wrap { border: 1px solid var(--line); border-radius: 8px; max-height: 330px; overflow: auto; margin-top: 8px; }
  .id { white-space: nowrap; font-weight: 700; }
  .issues { margin-top: 10px; }
  .issues li { margin: 2px 0; }
  .issues ul { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
  <h2>Сверка с подрядчиками</h2>
  <div class="filters">
    <label class="field">Год<select id="year"></select></label>
    <label class="field">Месяц<select id="month">
      <option value="">Весь год</option><option value="1">Январь</option><option value="2">Февраль</option><option value="3">Март</option>
      <option value="4">Апрель</option><option value="5">Май</option><option value="6">Июнь</option><option value="7">Июль</option>
      <option value="8">Август</option><option value="9">Сентябрь</option><option value="10">Октябрь</option>
      <option value="11">Ноябрь</option><option value="12">Декабрь</option></select></label>
    <label class="field">Подрядчик<select id="contractor"></select></label>
    <label class="field">Менеджер<select id="manager"></select></label>
  </div>
  <div class="acts">
    <button class="btn primary" id="runBtn" type="button">Показать</button>
    <button class="btn" id="excelBtn" type="button" disabled>📥 Скачать Excel</button>
    <button class="btn" id="copyBtn" type="button" disabled>📋 Скопировать таблицу</button>
  </div>
  <p class="small muted" style="margin:6px 0 0">Период — по дате задачи. Суммы — ровно как в таблице, без округления.</p>
  <div id="msg" class="msg" style="margin-top:6px"></div>
  <div id="results"></div>

<script>
  let last = null;
  const filters = () => ({ year: $('#year').value, month: $('#year').value ? $('#month').value : '', contractor: $('#contractor').value, manager: $('#manager').value });

  // Фильтры работают сразу (текущий месяц, все), списки подрядчиков и менеджеров догружаются в фоне
  (() => {
    const now = new Date(), y = now.getFullYear();
    fillSelect($('#year'), [String(y), String(y - 1)], 'Всё время', String(y));
    $('#month').value = String(now.getMonth() + 1);
    fillSelect($('#contractor'), [], 'Все подрядчики (загружаю список…)');
    fillSelect($('#manager'), [], 'Все менеджеры (загружаю список…)');
  })();
  run('getReconcileOptions').then(o => {
    const keep = sel => sel.value;
    const year = keep($('#year')), contractor = keep($('#contractor')), manager = keep($('#manager'));
    fillSelect($('#year'), o.years.map(String), 'Всё время', year || '');
    if (year && !o.years.map(String).includes(year)) $('#year').insertAdjacentHTML('beforeend', `<option value="${esc(year)}" selected>${esc(year)}</option>`);
    fillSelect($('#contractor'), o.contractors, 'Все подрядчики', contractor);
    fillSelect($('#manager'), o.managers, 'Все менеджеры', manager);
  }).catch(e => {
    fillSelect($('#contractor'), [], 'Все подрядчики');
    fillSelect($('#manager'), [], 'Все менеджеры');
    setMsg($('#msg'), 'Списки подрядчиков и менеджеров не загрузились: ' + e.message + '. Сверка по всем всё равно работает.', 'err');
  });

  function render(d) {
    const bad = new Set(d.issues.filter(x => x.kind !== 'extra').map(x => x.row));
    let html = `<p class="small muted" style="margin:10px 0 0"><b>${esc(d.label)}</b>${d.seconds != null ? ` · посчитано за ${d.seconds} с` : ''}</p><div class="tiles">
      <div class="tile"><div class="num">${d.count}</div><div class="lbl">задач</div></div>
      <div class="tile"><div class="num">${d.withMoney}</div><div class="lbl">с суммой</div></div>
      <div class="tile"><div class="num">${esc(d.sumText)}</div><div class="lbl">₽ с НДС</div></div></div>`;
    if (d.issues.length) {
      html += `<div class="hint issues"><b>Проверить перед сверкой: ${d.issues.length}</b><ul>` +
        d.issues.map(x => `<li><b>${esc(x.id || 'строка ' + x.row)}</b> — ${esc(x.text)}</li>`).join('') + '</ul></div>';
    }
    if (!$('#contractor').value && d.byContractor.length > 1) {
      html += '<h3>По подрядчикам</h3><table class="grid">' + d.byContractor.map(c =>
        `<tr><td>${esc(c.name)}</td><td class="num">${c.count} задач</td><td class="num"><b>${esc(c.sumText)} ₽</b></td></tr>`).join('') + '</table>';
    }
    html += '<div class="wrap"><table class="grid"><thead><tr><th>№ задачи</th><th>Тема письма</th><th>Языки</th><th>Менеджер</th><th>Смета</th><th class="num">Итого с НДС, ₽</th></tr></thead><tbody>' +
      (d.rows.length ? d.rows.map(r => `<tr class="${bad.has(r.row) ? 'bad' : ''}">
        <td class="id">${esc(r.id)}<div class="small muted">${esc(r.date)}</div></td>
        <td>${r.link ? `<a href="${esc(r.link)}" target="_blank">${esc(r.subject)}</a>` : esc(r.subject)}<div class="small muted">${esc([r.contractor, r.status].filter(Boolean).join(' · '))}</div></td>
        <td>${esc(r.languages)}</td><td>${esc(r.manager)}</td>
        <td class="num" style="text-align:left">${r.estimate ? `<a href="${esc(r.estimate)}" target="_blank">смета ↗</a>` : `<span class="muted">${esc(r.estimateNote || '—')}</span>`}</td>
        <td class="num">${esc(r.totalText) || '<span class="muted">—</span>'}</td></tr>`).join('')
        : '<tr><td colspan="6" class="muted">Задач за этот период нет</td></tr>') +
      `</tbody><tfoot><tr><td colspan="5">Итого</td><td class="num">${esc(d.sumText)}</td></tr></tfoot></table></div>`;
    $('#results').innerHTML = html;
  }

  // Пока считает — видно, сколько секунд прошло; через минуту — подсказка, где смотреть ошибку
  let timer = null;
  function waiting() {
    const t0 = Date.now();
    clearInterval(timer);
    const tick = () => {
      const sec = Math.round((Date.now() - t0) / 1000);
      $('#results').innerHTML = `<p class="muted">Считаю… ${sec} с</p>` + (sec >= 60
        ? '<p class="hint">Что-то долго. Проверьте «Расширения → Apps Script → Выполнения» (слева): там видно, на чём остановилось и какая ошибка. Пришлите скрин.</p>' : '');
    };
    tick();
    timer = setInterval(tick, 1000);
  }
  $('#runBtn').addEventListener('click', () => {
    waiting();
    $('#runBtn').disabled = true;
    $('#excelBtn').disabled = $('#copyBtn').disabled = true;
    setMsg($('#msg'), '');
    run('getReconciliation', filters()).then(d => {
      clearInterval(timer);
      if (!d || !d.rows) throw new Error('таблица вернула пустой ответ — обновите страницу таблицы (F5) и попробуйте ещё раз');
      last = d;
      render(d);
      $('#excelBtn').disabled = $('#copyBtn').disabled = false;
    }).catch(e => { clearInterval(timer); $('#results').innerHTML = ''; setMsg($('#msg'), 'Не получилось: ' + (e && e.message || e), 'err'); })
      .finally(() => { $('#runBtn').disabled = false; });
  });

  $('#excelBtn').addEventListener('click', () => {
    setMsg($('#msg'), 'Готовлю файл…');
    run('exportReconciliationToExcel', filters()).then(url => { setMsg($('#msg'), 'Готово — файл скачивается', 'ok'); window.open(url, '_blank'); })
      .catch(e => setMsg($('#msg'), 'Не получилось: ' + e.message, 'err'));
  });

  // Таблица для письма подрядчику: ссылки на сметы остаются кликабельными
  $('#copyBtn').addEventListener('click', () => {
    if (!last) return;
    const td = 'style="border:1px solid #ccc;padding:4px 8px"';
    const html = `<table style="border-collapse:collapse"><tr><th ${td}>№ задачи</th><th ${td}>Языки</th><th ${td}>Смета</th><th ${td}>Итого с НДС, ₽</th></tr>` +
      last.rows.map(r => `<tr><td ${td}>${esc(r.id)}</td><td ${td}>${esc(r.languages)}</td><td ${td}>${r.estimate ? `<a href="${esc(r.estimate)}">Ссылка на смету ${esc(r.id)}</a>` : esc(r.estimateNote || '')}</td><td ${td} align="right">${esc(r.totalText)}</td></tr>`).join('') +
      `<tr><td ${td} colspan="3"><b>Итого</b></td><td ${td} align="right"><b>${esc(last.sumText)}</b></td></tr></table>`;
    copyHtml(html).then(() => setMsg($('#msg'), 'Скопировано — вставьте в письмо или документ', 'ok'));
  });
</script>
</body>
</html>
